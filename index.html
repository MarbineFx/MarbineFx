<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarbineFX Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#251507,#030201 45%);color:#fff3db;font-family:Arial}.card{width:min(430px,92vw);padding:28px;border:1px solid #4c3b19;border-radius:22px;background:#0a0704;box-shadow:0 30px 80px #000}.logo{font-size:28px;font-weight:900;color:#e6c766}.logo span{color:white}.sub{color:#8f826c;font-size:13px;line-height:1.6;margin:8px 0 22px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button,.btn{border:1px solid #4c3b19;background:#120d07;color:#e6c766;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.tabs button.active,.btn.gold{background:linear-gradient(135deg,#ffe39a,#c99c35);color:#090500}.field{margin:10px 0}.field label{display:block;font-size:11px;color:#8f826c;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:11px;border:1px solid #332712;background:#050301;color:white}.btn{width:100%;margin-top:10px}.link{display:block;text-align:center;margin-top:14px;color:#d8bd73;font-size:12px;cursor:pointer}.msg{min-height:20px;color:#d99a88;font-size:12px;margin-top:10px}.safe{margin-top:18px;padding-top:14px;border-top:1px solid #21180d;color:#6f6557;font-size:11px;line-height:1.55}</style></head><body><div class="card"><div class="logo">Marbine<span>FX</span></div><div class="sub">Members only. Sign in securely to enter the market dashboard.</div><div class="tabs"><button id="loginTab" class="active" onclick="mode='login';draw()">LOGIN</button><button id="signupTab" onclick="mode='signup';draw()">CREATE ACCOUNT</button></div><div class="field"><label>EMAIL</label><input id="email" type="email" placeholder="you@gmail.com"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" placeholder="Your password"></div><button id="mainBtn" class="btn gold" onclick="submitAuth()">LOGIN</button><button class="btn" onclick="googleLogin()">CONTINUE WITH GOOGLE</button><span class="link" onclick="forgot()">Forgot password?</span><div id="msg" class="msg"></div><div class="safe">Passwords are handled by Supabase Authentication. MarbineFX does not email, display, or send users' passwords to the site owner.</div></div><script>const URL='https://dodjxijptbvkvpjhelhm.supabase.co',KEY='sb_publishable_Eh7J3ChO6ljz7vHVBBUH2Q_st9LhsJA',sb=supabase.createClient(URL,KEY);let mode='login';function draw(){loginTab.classList.toggle('active',mode==='login');signupTab.classList.toggle('active',mode==='signup');mainBtn.textContent=mode==='login'?'LOGIN':'CREATE ACCOUNT';msg.textContent=''}async function submitAuth(){msg.textContent='Please wait…';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){msg.textContent='Enter your email and password.';return}let r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(r.error){msg.textContent=r.error.message;return}if(mode==='signup'&&!r.data.session){msg.textContent='Check your email to confirm your account, then login.';return}location.href='app.html'}async function googleLogin(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:new URL('app.html',location.href).href}})}async function forgot(){const email=document.getElementById('email').value.trim();if(!email){msg.textContent='Type your email first, then press Forgot password.';return}const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:new URL('reset.html',location.href).href});msg.textContent=r.error?r.error.message:'Password reset link sent. Check your email.'}(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)location.href='app.html'})()</script></body></html>
