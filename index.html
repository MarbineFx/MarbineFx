<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030201">
<title>MarbineFX | Login</title>
<style>
*{box-sizing:border-box}
:root{--gold:#e6c766;--gold2:#ffe39a;--line:rgba(230,199,102,.18);--ivory:#fff3db;--muted:#8f826c}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#030201;color:var(--ivory)}
body{
  min-height:100vh;display:grid;place-items:center;padding:18px;
  background:
    radial-gradient(circle at 18% 8%,rgba(143,31,31,.16),transparent 26rem),
    radial-gradient(circle at 82% 8%,rgba(20,98,71,.13),transparent 28rem),
    radial-gradient(circle at 50% -5%,rgba(230,199,102,.10),transparent 32rem),
    #030201;
}
.card{
  width:min(440px,94vw);padding:28px;border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(145deg,rgba(230,199,102,.025),transparent 40%),#0a0704;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
}
.logo{font-size:29px;font-weight:900;color:var(--gold);letter-spacing:.04em}.logo span{color:#fff}
.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tabs button,.btn{
  border:1px solid #4c3b19;background:#120d07;color:var(--gold);border-radius:12px;
  padding:12px;font-weight:800;cursor:pointer;transition:.18s
}
.tabs button:hover,.btn:hover{filter:brightness(1.08)}
.tabs button.active,.btn.gold{background:linear-gradient(135deg,#fff0ae,#d3a33b);color:#090500;border-color:#ffe39a}
.field{margin:11px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:800;letter-spacing:.06em}
.field input{width:100%;padding:13px;border-radius:11px;border:1px solid #332712;background:#050301;color:#fff;outline:none}
.field input:focus{border-color:rgba(230,199,102,.5);box-shadow:0 0 0 3px rgba(230,199,102,.05)}
.btn{width:100%;margin-top:10px}.btn:disabled{opacity:.5;cursor:not-allowed}
.link{display:block;text-align:center;margin-top:14px;color:#d8bd73;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.msg{min-height:22px;color:#d99a88;font-size:12px;line-height:1.45;margin-top:12px}
.msg.ok{color:#70cba3}
.safe{margin-top:18px;padding-top:14px;border-top:1px solid #21180d;color:#6f6557;font-size:11px;line-height:1.55}
.loader{display:none;text-align:center;color:#837761;font-size:11px;margin-top:8px}.loader.show{display:block}
@media(max-width:480px){.card{padding:22px 18px}.tabs button,.btn{padding:11px}.logo{font-size:25px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Marbine<span>FX</span></div>
  <div class="sub">Members only. Sign in securely to enter the market dashboard.</div>

  <div class="tabs">
    <button id="loginTab" type="button">LOGIN</button>
    <button id="signupTab" type="button">CREATE ACCOUNT</button>
  </div>

  <div class="field">
    <label for="email">EMAIL</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@gmail.com">
  </div>

  <div class="field">
    <label for="password">PASSWORD</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Your password">
  </div>

  <button id="mainBtn" class="btn gold" type="button">LOGIN</button>
  <button id="googleBtn" class="btn" type="button">CONTINUE WITH GOOGLE</button>

  <button id="forgotBtn" type="button" class="link" style="border:0;background:none;width:100%">Forgot password?</button>

  <div id="loader" class="loader">Connecting securely…</div>
  <div id="msg" class="msg"></div>

  <div class="safe">
    Passwords are handled by Supabase Authentication. MarbineFX never displays or sends users' passwords to the site owner.
  </div>
</div>

<script>
const SUPABASE_URL = 'https://dodjxijptbvkvpjhelhm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Eh7J3ChO6ljz7vHVBBUH2Q_st9LhsJA';

const el = {};
let mode = 'login';
let sb = null;

function byId(id){ return document.getElementById(id); }

function setMessage(text, ok=false){
  el.msg.textContent = text || '';
  el.msg.classList.toggle('ok', !!ok);
}

function setBusy(busy){
  el.mainBtn.disabled = busy;
  el.googleBtn.disabled = busy;
  el.forgotBtn.disabled = busy;
  el.loginTab.disabled = busy;
  el.signupTab.disabled = busy;
  el.loader.classList.toggle('show', busy);
}

function draw(){
  el.loginTab.classList.toggle('active', mode === 'login');
  el.signupTab.classList.toggle('active', mode === 'signup');
  el.mainBtn.textContent = mode === 'login' ? 'LOGIN' : 'CREATE ACCOUNT';
  el.password.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  setMessage('');
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=resolve;
    s.onerror=()=>reject(new Error('Could not load authentication library.'));
    document.head.appendChild(s);
  });
}

async function loadSupabase(){
  if(window.supabase?.createClient) return;
  const sources=[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2'
  ];
  let lastError=null;
  for(const src of sources){
    try{
      await loadScript(src);
      if(window.supabase?.createClient) return;
    }catch(e){ lastError=e; }
  }
  throw lastError || new Error('Authentication library failed to load.');
}

async function init(){
  el.loginTab=byId('loginTab');
  el.signupTab=byId('signupTab');
  el.email=byId('email');
  el.password=byId('password');
  el.mainBtn=byId('mainBtn');
  el.googleBtn=byId('googleBtn');
  el.forgotBtn=byId('forgotBtn');
  el.msg=byId('msg');
  el.loader=byId('loader');

  el.loginTab.addEventListener('click',()=>{ mode='login'; draw(); });
  el.signupTab.addEventListener('click',()=>{ mode='signup'; draw(); });
  el.mainBtn.addEventListener('click',submitAuth);
  el.googleBtn.addEventListener('click',googleLogin);
  el.forgotBtn.addEventListener('click',forgot);

  el.password.addEventListener('keydown',e=>{
    if(e.key==='Enter') submitAuth();
  });

  draw();
  setBusy(true);
  setMessage('Loading secure login…');

  try{
    await loadSupabase();
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data, error } = await sb.auth.getSession();
    if(error) console.warn(error);
    if(data?.session){
      location.replace('app.html');
      return;
    }

    setMessage('');
  }catch(e){
    console.error(e);
    setMessage('Login system could not load. Check your internet connection and refresh the page.');
  }finally{
    setBusy(false);
  }
}

async function submitAuth(){
  if(!sb){
    setMessage('Login system is still loading. Please wait a moment.');
    return;
  }

  const email=el.email.value.trim();
  const password=el.password.value;

  if(!email || !password){
    setMessage('Enter your email and password.');
    return;
  }
  if(mode==='signup' && password.length < 6){
    setMessage('Use a password with at least 6 characters.');
    return;
  }

  setBusy(true);
  setMessage(mode==='login' ? 'Logging in…' : 'Creating your account…');

  try{
    const r = mode==='login'
      ? await sb.auth.signInWithPassword({email,password})
      : await sb.auth.signUp({
          email,
          password,
          options:{ emailRedirectTo:new URL('app.html',location.href).href }
        });

    if(r.error) throw r.error;

    if(mode==='signup' && !r.data.session){
      setMessage('Account created. Check your email and confirm it, then come back and login.', true);
      return;
    }

    location.replace('app.html');
  }catch(e){
    setMessage(e?.message || 'Something went wrong. Please try again.');
  }finally{
    setBusy(false);
  }
}

async function googleLogin(){
  if(!sb){
    setMessage('Login system is still loading. Please wait a moment.');
    return;
  }

  setBusy(true);
  setMessage('Opening Google login…');

  try{
    const redirectTo = new URL('app.html', location.href).href;
    const { error } = await sb.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo }
    });
    if(error) throw error;
  }catch(e){
    setMessage((e?.message || 'Google login failed.') + ' If this is your first time using Google login, enable the Google provider in Supabase Authentication.');
    setBusy(false);
  }
}

async function forgot(){
  if(!sb){
    setMessage('Login system is still loading. Please wait a moment.');
    return;
  }

  const email=el.email.value.trim();
  if(!email){
    setMessage('Type the email you used for your account first, then press Forgot password.');
    el.email.focus();
    return;
  }

  setBusy(true);
  setMessage('Sending password reset link…');

  try{
    const redirectTo = new URL('reset.html', location.href).href;
    const { error } = await sb.auth.resetPasswordForEmail(email,{redirectTo});
    if(error) throw error;
    setMessage('Reset link sent. Check your email inbox and spam folder.', true);
  }catch(e){
    setMessage(e?.message || 'Could not send reset email.');
  }finally{
    setBusy(false);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
