<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarbineFX | Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#030201;color:#fff3db;font-family:Arial;display:grid;place-items:center;min-height:100vh;padding:18px}
.c{width:min(420px,92vw);padding:25px;background:#0b0704;border:1px solid #4c3b19;border-radius:18px}
input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:10px}
input{background:#050301;color:white;border:1px solid #332712}
button{background:linear-gradient(135deg,#ffe39a,#d1a43b);border:0;font-weight:900;cursor:pointer}
#m{font-size:12px;line-height:1.45;color:#d99a88}.ok{color:#70cba3!important}
</style></head><body>
<div class="c"><h2>Set a new password</h2><p style="color:#887b68;font-size:12px">Choose a new password for your MarbineFX account.</p><input id="newPassword" type="password" autocomplete="new-password" placeholder="New password"><button id="updateBtn">UPDATE PASSWORD</button><p id="m"></p></div>
<script>
const sb=supabase.createClient('https://dodjxijptbvkvpjhelhm.supabase.co','sb_publishable_Eh7J3ChO6ljz7vHVBBUH2Q_st9LhsJA');
const p=document.getElementById('newPassword'),btn=document.getElementById('updateBtn'),m=document.getElementById('m');
btn.addEventListener('click',async()=>{
  if(p.value.length<6){m.textContent='Use at least 6 characters.';return}
  btn.disabled=true;m.textContent='Updating…';m.classList.remove('ok');
  const {error}=await sb.auth.updateUser({password:p.value});
  btn.disabled=false;
  if(error){m.textContent=error.message;return}
  m.textContent='Password updated. Returning to login…';m.classList.add('ok');
  setTimeout(()=>location.href='index.html',1200);
});
</script></body></html>
